<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koleksi Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-4xl px-4 py-10">
      <header class="mb-8">
        <h1 class="text-3xl font-semibold">Koleksi Prompt</h1>
        <p class="mt-2 text-sm text-slate-600">Tambahkan prompt baru dan simpan otomatis di browser.</p>
      </header>

      <section class="mb-8 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="mb-4 text-lg font-medium">Input Prompt Baru</h2>
        <form id="prompt-form" class="space-y-4">
          <div>
            <label for="category" class="mb-1 block text-sm font-medium text-slate-700">Kategori</label>
            <select
              id="category"
              name="category"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
            >
              <option value="Luxury">Luxury</option>
              <option value="Food">Food</option>
              <option value="Cinematic">Cinematic</option>
              <option value="Custom">Custom</option>
            </select>
          </div>

          <div>
            <label for="prompt" class="mb-1 block text-sm font-medium text-slate-700">Isi Prompt</label>
            <textarea
              id="prompt"
              name="prompt"
              rows="4"
              required
              placeholder="Tulis prompt Anda di sini..."
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
            ></textarea>
          </div>

          <button
            type="submit"
            class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700"
          >
            Simpan Prompt
          </button>
        </form>
      </section>

      <section>
        <h2 class="mb-4 text-lg font-medium">Daftar Kartu Prompt</h2>
        <div id="prompt-list" class="grid gap-4 sm:grid-cols-2"></div>
      </section>
    </main>

    <template id="prompt-card-template">
      <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="category rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700"></span>
          <button
            type="button"
            class="delete rounded-md px-2 py-1 text-xs font-medium text-rose-700 hover:bg-rose-50"
          >
            Hapus
          </button>
        </div>
        <p class="content text-sm text-slate-700"></p>
      </article>
    </template>

    <script>
      const STORAGE_KEY = 'promptCards';
      const form = document.getElementById('prompt-form');
      const list = document.getElementById('prompt-list');
      const template = document.getElementById('prompt-card-template');

      const getPrompts = () => {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(data) ? data : [];
        } catch {
          return [];
        }
      };

      const savePrompts = (prompts) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
      };

      const renderPrompts = () => {
        const prompts = getPrompts();
        list.innerHTML = '';

        if (prompts.length === 0) {
          list.innerHTML = '<p class="text-sm text-slate-500">Belum ada prompt tersimpan.</p>';
          return;
        }

        prompts.forEach((item) => {
          const fragment = template.content.cloneNode(true);
          fragment.querySelector('.category').textContent = item.category;
          fragment.querySelector('.content').textContent = item.prompt;

          const deleteButton = fragment.querySelector('.delete');
          deleteButton.addEventListener('click', () => {
            const updated = getPrompts().filter((entry) => entry.id !== item.id);
            savePrompts(updated);
            renderPrompts();
          });

          list.appendChild(fragment);
        });
      };

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const category = form.category.value;
        const prompt = form.prompt.value.trim();
        if (!prompt) return;

        const prompts = getPrompts();
        prompts.unshift({
          id: crypto.randomUUID(),
          category,
          prompt,
        });

        savePrompts(prompts);
        form.reset();
        form.category.value = 'Luxury';
        renderPrompts();
      });

      renderPrompts();
    </script>
  </body>
</html>
