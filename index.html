<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koleksi Prompt Premium</title>
    <script>
      tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      .card-enter {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      .card-enter-active {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 400ms ease, transform 400ms ease;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto max-w-5xl px-4 py-10">
      <header class="mb-8 flex items-start justify-between gap-4">
        <div>
          <p class="mb-2 inline-flex rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.14em] text-amber-800 dark:bg-amber-500/20 dark:text-amber-300">Prompt Studio</p>
          <h1 class="text-3xl font-semibold tracking-tight">Koleksi Prompt Premium</h1>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Tambahkan prompt baru dengan tampilan elegan dan simpan otomatis di browser.</p>
        </div>
        <button
          id="theme-toggle"
          type="button"
          class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        >
          🌙 Dark Mode
        </button>
      </header>

      <section class="mb-8 rounded-2xl border border-slate-200 bg-white/95 p-6 shadow-sm backdrop-blur transition-colors dark:border-slate-800 dark:bg-slate-900/95">
        <h2 class="mb-4 text-lg font-semibold">Input Prompt Baru</h2>
        <form id="prompt-form" class="space-y-4">
          <div>
            <label for="category" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200">Kategori</label>
            <select
              id="category"
              name="category"
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none dark:border-slate-700 dark:bg-slate-950"
            >
              <option value="Luxury">Luxury</option>
              <option value="Food">Food</option>
              <option value="Cinematic">Cinematic</option>
              <option value="Custom">Custom</option>
            </select>
          </div>

          <div>
            <label for="prompt" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200">Isi Prompt</label>
            <textarea
              id="prompt"
              name="prompt"
              rows="4"
              required
              placeholder="Tulis prompt Anda di sini..."
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none dark:border-slate-700 dark:bg-slate-950"
            ></textarea>
          </div>

          <button
            type="submit"
            class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:-translate-y-0.5 hover:bg-slate-700 dark:bg-amber-400 dark:text-slate-900 dark:hover:bg-amber-300"
          >
            Simpan Prompt
          </button>
        </form>
      </section>

      <section>
        <h2 class="mb-4 text-lg font-semibold">Daftar Kartu Prompt</h2>

        <div class="mb-4 space-y-3">
          <label for="search-input" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Search Prompt</label>
          <input
            id="search-input"
            type="search"
            placeholder="Cari isi prompt..."
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none dark:border-slate-700 dark:bg-slate-950"
          />

          <div id="category-filters" class="flex flex-wrap gap-2">
            <button type="button" data-filter="All" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">All</button>
            <button type="button" data-filter="Luxury" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Luxury</button>
            <button type="button" data-filter="Food" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Food</button>
            <button type="button" data-filter="Cinematic" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Cinematic</button>
          </div>
        </div>

        <div id="prompt-list" class="grid gap-4 sm:grid-cols-2"></div>
      </section>
    </main>

    <template id="prompt-card-template">
      <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition dark:border-slate-800 dark:bg-slate-900">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="category rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-200"></span>
          <div class="flex items-center gap-1">
            <button
              type="button"
              class="edit inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
              aria-label="Edit prompt"
              title="Edit"
            >
              <span aria-hidden="true">✏️</span>
              <span>Edit</span>
            </button>
            <button
              type="button"
              class="delete inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-rose-700 transition hover:bg-rose-50 dark:text-rose-300 dark:hover:bg-rose-500/10"
              aria-label="Hapus prompt"
              title="Hapus"
            >
              <span aria-hidden="true">🗑️</span>
              <span>Hapus</span>
            </button>
          </div>
        </div>
        <p class="content text-sm leading-relaxed text-slate-700 dark:text-slate-300"></p>
      </article>
    </template>

    <script>
      const STORAGE_KEY = 'promptCards';
      const THEME_KEY = 'promptTheme';
      const form = document.getElementById('prompt-form');
      const list = document.getElementById('prompt-list');
      const template = document.getElementById('prompt-card-template');
      const themeToggle = document.getElementById('theme-toggle');
      const searchInput = document.getElementById('search-input');
      const filterButtons = Array.from(document.querySelectorAll('.filter-pill'));

      let activeCategoryFilter = 'All';

      const updateThemeLabel = () => {
        const dark = document.documentElement.classList.contains('dark');
        themeToggle.textContent = dark ? '☀️ Light Mode' : '🌙 Dark Mode';
      };

      const initializeTheme = () => {
        const savedTheme = localStorage.getItem(THEME_KEY);
        const shouldUseDark =
          savedTheme === 'dark' ||
          (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.classList.toggle('dark', shouldUseDark);
        updateThemeLabel();
      };

      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        updateThemeLabel();
      });

      const getPrompts = () => {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(data) ? data : [];
        } catch {
          return [];
        }
      };

      const savePrompts = (prompts) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
      };

      const updateFilterPills = () => {
        filterButtons.forEach((button) => {
          const isActive = button.dataset.filter === activeCategoryFilter;
          button.className = isActive
            ? 'filter-pill rounded-full border border-amber-400 bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-900 transition dark:border-amber-300 dark:bg-amber-300/20 dark:text-amber-200'
            : 'filter-pill rounded-full border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition hover:border-slate-400 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300';
        });
      };

      const getFilteredPrompts = () => {
        const query = searchInput.value.trim().toLowerCase();
        return getPrompts().filter((item) => {
          const categoryMatches = activeCategoryFilter === 'All' || item.category === activeCategoryFilter;
          const searchMatches = item.prompt.toLowerCase().includes(query);
          return categoryMatches && searchMatches;
        });
      };

      const renderPrompts = (highlightId = null) => {
        const prompts = getFilteredPrompts();
        list.innerHTML = '';

        if (prompts.length === 0) {
          list.innerHTML = '<p class="text-sm text-slate-500 dark:text-slate-400">Tidak ada prompt yang cocok dengan filter saat ini.</p>';
          return;
        }

        prompts.forEach((item) => {
          const fragment = template.content.cloneNode(true);
          const card = fragment.querySelector('article');
          fragment.querySelector('.category').textContent = item.category;
          fragment.querySelector('.content').textContent = item.prompt;

          if (item.id === highlightId) {
            card.classList.add('card-enter');
            requestAnimationFrame(() => {
              card.classList.add('card-enter-active');
            });
          }

          const deleteButton = fragment.querySelector('.delete');
          const editButton = fragment.querySelector('.edit');

          editButton.addEventListener('click', () => {
            form.category.value = item.category;
            form.prompt.value = item.prompt;
            form.prompt.focus();
          });

          deleteButton.addEventListener('click', () => {
            const confirmed = window.confirm('Yakin ingin menghapus prompt ini?');
            if (!confirmed) return;

            const updated = getPrompts().filter((entry) => entry.id !== item.id);
            savePrompts(updated);
            renderPrompts();
          });

          list.appendChild(fragment);
        });
      };

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeCategoryFilter = button.dataset.filter;
          updateFilterPills();
          renderPrompts();
        });
      });

      searchInput.addEventListener('input', () => {
        renderPrompts();
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const category = form.category.value;
        const prompt = form.prompt.value.trim();
        if (!prompt) return;

        const newPrompt = {
          id: crypto.randomUUID(),
          category,
          prompt,
        };

        const prompts = getPrompts();
        prompts.unshift(newPrompt);

        savePrompts(prompts);
        form.reset();
        form.category.value = 'Luxury';
        renderPrompts(newPrompt.id);
      });

      initializeTheme();
      updateFilterPills();
      renderPrompts();
    </script>
  </body>
</html>
