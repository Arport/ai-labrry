<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koleksi Prompt Premium</title>
    <script>
      tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      .card-enter {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      .card-enter-active {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 400ms ease, transform 400ms ease;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto max-w-5xl px-3 py-6 sm:px-4 sm:py-10">
      <div
        id="toast"
        role="status"
        aria-live="polite"
        class="pointer-events-none fixed right-4 top-4 z-50 translate-y-2 rounded-lg bg-slate-900 px-3 py-2 text-xs font-medium text-white opacity-0 transition duration-300 dark:bg-amber-400 dark:text-slate-900"
      >
        Berhasil
      </div>

      <header class="mb-6 flex flex-col gap-3 sm:mb-8 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
        <div>
          <p class="mb-2 inline-flex rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.14em] text-amber-800 dark:bg-amber-500/20 dark:text-amber-300">Prompt Studio</p>
          <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Koleksi Prompt Premium</h1>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Simpan prompt ke LocalStorage dengan cepat dan simpel.</p>
        </div>
        <button
          id="theme-toggle"
          type="button"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 sm:w-auto dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        >
          ☀️ Light Mode
        </button>
      </header>

      

      <section class="mb-6 rounded-2xl border border-slate-200 bg-white/95 p-4 shadow-sm backdrop-blur transition-colors sm:mb-8 sm:p-6 dark:border-slate-800 dark:bg-slate-900/95">
        <h2 class="mb-4 text-lg font-semibold">Input Prompt Baru</h2>
        <form id="prompt-form" class="space-y-4">
          <div>
            <label for="category" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200">Kategori</label>
            <select id="category" name="category" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none">
              <option value="Luxury">Luxury</option>
              <option value="Food">Food</option>
              <option value="Cinematic">Cinematic</option>
              <option value="Custom">Custom</option>
            </select>
          </div>

          <div>
            <label for="prompt" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200">Isi Prompt</label>
            <textarea id="prompt" name="prompt" rows="4" required placeholder="Tulis prompt Anda di sini..." class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none"></textarea>
          </div>

          <div class="grid gap-2 sm:flex sm:flex-wrap">
            <button type="submit" class="w-full rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:-translate-y-0.5 hover:bg-slate-700 sm:w-auto">Simpan Prompt</button>
            <button id="export-json" type="button" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 sm:w-auto">Export JSON</button>
            <button id="export-text" type="button" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 sm:w-auto">Export TXT</button>
          </div>
        </form>
      </section>

      <section>
        <h2 class="mb-4 text-lg font-semibold">Daftar Kartu Prompt</h2>

        <div class="mb-4 space-y-3">
          <label for="search-input" class="block text-sm font-medium text-slate-700">Search Prompt</label>
          <input id="search-input" type="search" placeholder="Cari isi prompt..." class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm transition focus:border-amber-400 focus:outline-none" />

          <div id="category-filters" class="flex flex-wrap gap-2">
            <button type="button" data-filter="All" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">All</button>
            <button type="button" data-filter="Luxury" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Luxury</button>
            <button type="button" data-filter="Food" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Food</button>
            <button type="button" data-filter="Cinematic" class="filter-pill rounded-full border px-3 py-1 text-xs font-semibold transition">Cinematic</button>
          </div>
        </div>

        <div id="prompt-list" class="grid gap-3 sm:gap-4 sm:grid-cols-2"></div>
      </section>
    </main>

    <template id="prompt-card-template">
      <article class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm transition sm:p-4 dark:border-slate-800 dark:bg-slate-900">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="category rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700"></span>
          <div class="flex items-center gap-1">
            <button type="button" class="copy inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-100" aria-label="Salin prompt" title="Salin">
              <span aria-hidden="true">📋</span><span>Salin</span>
            </button>
            <button type="button" class="delete inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-rose-700 transition hover:bg-rose-50" aria-label="Hapus prompt" title="Hapus">
              <span aria-hidden="true">🗑️</span><span>Hapus</span>
            </button>
          </div>
        </div>
        <img class="preview-image mb-3 h-36 w-full rounded-xl object-cover sm:h-40" alt="Preview kategori prompt" loading="lazy" />
        <p class="content text-sm leading-relaxed text-slate-700"></p>
      </article>
    </template>

    <script>
      const STORAGE_KEY = 'promptCards';
      const THEME_KEY = 'promptTheme';

      const form = document.getElementById('prompt-form');
      const list = document.getElementById('prompt-list');
      const template = document.getElementById('prompt-card-template');
      const themeToggle = document.getElementById('theme-toggle');
      const searchInput = document.getElementById('search-input');
      const filterButtons = Array.from(document.querySelectorAll('.filter-pill'));
      const toast = document.getElementById('toast');
      const exportJsonButton = document.getElementById('export-json');
      const exportTextButton = document.getElementById('export-text');

      let activeCategoryFilter = 'All';
      let toastTimeoutId;

      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimeoutId);
        toastTimeoutId = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 1400);
      };

      const updateThemeLabel = () => {
        themeToggle.textContent = '☀️ Light Mode';
      };

      const initializeTheme = () => {
        document.documentElement.classList.remove('dark');
        localStorage.setItem(THEME_KEY, 'light');
        updateThemeLabel();
      };

      themeToggle.addEventListener('click', () => {
        document.documentElement.classList.remove('dark');
        localStorage.setItem(THEME_KEY, 'light');
        showToast('Mode tetap Light');
      });

      const getPrompts = () => {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(data) ? data : [];
        } catch {
          return [];
        }
      };

      const savePrompts = (prompts) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
      };

      const downloadFile = (filename, content, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const exportPromptData = (format = 'json') => {
        const prompts = getPrompts();
        if (prompts.length === 0) {
          showToast('Belum ada data untuk diexport');
          return;
        }

        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        if (format === 'text') {
          const content = prompts.map((item, index) => `${index + 1}. [${item.category}]\n${item.prompt}`).join('\n\n');
          downloadFile(`prompt-data-${timestamp}.txt`, content, 'text/plain;charset=utf-8');
          showToast('Export TXT berhasil');
          return;
        }

        const content = JSON.stringify(prompts, null, 2);
        downloadFile(`prompt-data-${timestamp}.json`, content, 'application/json;charset=utf-8');
        showToast('Export JSON berhasil');
      };

      const updateFilterPills = () => {
        filterButtons.forEach((button) => {
          const isActive = button.dataset.filter === activeCategoryFilter;
          button.className = isActive
            ? 'filter-pill rounded-full border border-amber-400 bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-900 transition'
            : 'filter-pill rounded-full border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition hover:border-slate-400';
        });
      };

      const getPreviewUrl = (category) => {
        const query = encodeURIComponent((category || 'prompt').toLowerCase());
        return `https://source.unsplash.com/featured/?${query}`;
      };

      const getFilteredPrompts = () => {
        const query = searchInput.value.trim().toLowerCase();
        return getPrompts().filter((item) => {
          const categoryMatches = activeCategoryFilter === 'All' || item.category === activeCategoryFilter;
          const searchMatches = item.prompt.toLowerCase().includes(query);
          return categoryMatches && searchMatches;
        });
      };

      const renderPrompts = (highlightId = null) => {
        const prompts = getFilteredPrompts();
        list.innerHTML = '';

        if (prompts.length === 0) {
          list.innerHTML = '<p class="text-sm text-slate-500">Tidak ada prompt yang cocok dengan filter saat ini.</p>';
          return;
        }

        prompts.forEach((item) => {
          const fragment = template.content.cloneNode(true);
          const card = fragment.querySelector('article');
          fragment.querySelector('.category').textContent = item.category;
          fragment.querySelector('.content').textContent = item.prompt;

          const previewImage = fragment.querySelector('.preview-image');
          previewImage.src = getPreviewUrl(item.category);
          previewImage.alt = `Preview ${item.category}`;
          previewImage.addEventListener('error', () => {
            previewImage.src = 'https://source.unsplash.com/featured/?creative';
          }, { once: true });

          if (item.id === highlightId) {
            card.classList.add('card-enter');
            requestAnimationFrame(() => card.classList.add('card-enter-active'));
          }

          const copyButton = fragment.querySelector('.copy');
          const deleteButton = fragment.querySelector('.delete');

          copyButton.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(item.prompt);
              showToast('Berhasil Disalin');
            } catch {
              showToast('Gagal menyalin prompt');
            }
          });

          deleteButton.addEventListener('click', () => {
            const updated = getPrompts().filter((entry) => entry.id !== item.id);
            savePrompts(updated);
            renderPrompts();
          });

          list.appendChild(fragment);
        });
      };

      const savePromptFromForm = () => {
        const category = form.category.value;
        const prompt = form.prompt.value.trim();
        if (!prompt) return null;

        const newPrompt = { id: crypto.randomUUID(), category, prompt };
        const prompts = getPrompts();
        prompts.unshift(newPrompt);
        savePrompts(prompts);


        return newPrompt;
      };

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeCategoryFilter = button.dataset.filter;
          updateFilterPills();
          renderPrompts();
        });
      });

      searchInput.addEventListener('input', renderPrompts);
      exportJsonButton.addEventListener('click', () => exportPromptData('json'));
      exportTextButton.addEventListener('click', () => exportPromptData('text'));

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const newPrompt = savePromptFromForm();
        if (!newPrompt) return;
        form.reset();
        form.category.value = 'Luxury';
        renderPrompts(newPrompt.id);
      });

      const initializeApp = () => {
        initializeTheme();
        updateFilterPills();
        renderPrompts();

      };

      initializeApp();
    </script>
  </body>
</html>
